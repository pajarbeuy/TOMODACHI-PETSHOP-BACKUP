appId: com.example.frontendd
---
# TC-004 | Login – Validasi captcha kosong
# Memastikan error muncul jika captcha tidak diisi

- launchApp
- assertVisible: "Welcome back! 👋"
- tapOn: "you@example.com"
- inputText: "admin@tomodachi.com"
- tapOn: "Enter your password"
- inputText: "password123"
- tapOn: "Sign In"
- assertVisible: "Captcha answer is required"
- takeScreenshot: "04_login_captcha_kosong"
