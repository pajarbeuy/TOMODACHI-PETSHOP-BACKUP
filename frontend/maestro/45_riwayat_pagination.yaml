appId: com.example.frontendd
---
# TC-045 | Riwayat – Pagination tampil
# Memastikan pagination tampil di daftar transaksi

- launchApp
- runFlow:
    file: "login_kasir.yaml"
- waitForAnimationToEnd
- tapOn: "Riwayat"
- scrollUntilVisible:
    element: "Halaman"
    direction: DOWN
    timeout: 5000
- takeScreenshot: "45_riwayat_pagination"
