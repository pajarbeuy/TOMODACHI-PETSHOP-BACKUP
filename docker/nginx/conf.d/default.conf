server {
    listen 80;
    server_name tomodachi-petshop.xyz www.tomodachi-petshop.xyz;

    # Redirect semua HTTP -> HTTPS (Cloudflare juga enforce ini via "Always Use HTTPS")
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tomodachi-petshop.xyz www.tomodachi-petshop.xyz;
    client_max_body_size 20m;
    root /var/www/laravel/public;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/tomodachi.crt;
    ssl_certificate_key /etc/nginx/ssl/tomodachi.key;

    # SSL hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trusted proxy: Cloudflare -> Nginx -> PHP-FPM.
    # Sekarang pakai Full SSL mode, HTTPS sudah real di origin.
    set $forwarded_https "on";

    # API requests.
    location ^~ /api/ {
        fastcgi_pass laravel:9000;
        include fastcgi_params;
        fastcgi_pass_request_body on;
        fastcgi_param CONTENT_TYPE   $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/laravel/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param HTTPS           $forwarded_https;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Serve static downloads directly (like APKs)
    location /download/ {
        try_files $uri =404;
    }

    # Laravel storage (uploaded product images, etc).
    location /storage/ {
        alias /var/www/laravel/storage/app/public/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel routes and views.
    location / {
        fastcgi_pass laravel:9000;
        include fastcgi_params;
        fastcgi_pass_request_body on;
        fastcgi_param CONTENT_TYPE   $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/laravel/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param HTTPS           $forwarded_https;
        fastcgi_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
}
